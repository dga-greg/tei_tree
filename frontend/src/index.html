<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Family Heritage</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Preserve your family's history and explore your ancestry across generations." />
    <meta name="theme-color" content="#14532d" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Family Heritage" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Shown until the app has started (it waits for the server to confirm the session). */
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 1rem; text-align: center; font-family: Sora, system-ui, sans-serif; color: #57534e; background: #fafaf9; }
      .boot-spinner { width: 2rem; height: 2rem; border-radius: 9999px; border: 3px solid #d6d3d1; border-top-color: #15803d; animation: boot-spin 0.8s linear infinite; }
      .boot-slow { max-width: 28rem; font-size: 0.875rem; opacity: 0; animation: boot-show 0s 8s forwards; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-color-scheme: dark) { .boot { color: #d6d3d1; background: #0c0a09; } .boot-spinner { border-color: #44403c; border-top-color: #4ade80; } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <fh-root>
      <div class="boot" role="status">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>Loading Family Heritage…</p>
        <p class="boot-slow">Still waiting for the server. If this does not change, the API may be stopped or unable to reach the database.</p>
      </div>
    </fh-root>
    <noscript>Family Heritage needs JavaScript enabled to run.</noscript>
  </body>
</html>
