# The whole application in containers, with S3-compatible storage (SeaweedFS) and an e-mail catcher
# (Mailpit). A production-shaped stack to try a release locally or as a starting point for hosting:
#
#   cp deploy/.env.example deploy/.env    # then set the secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   open http://localhost:8080            # e-mail: http://localhost:8025
#
# For real hosting, put TLS in front of `web` (set APP_ORIGIN to the https address and COOKIE_SECURE=true),
# use managed MongoDB/Redis/S3 where possible, and point SMTP_URL at a real mail service.

x-api-env: &api-env
  NODE_ENV: production
  PORT: '3000'
  TRUST_PROXY: '1'
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Only for http://localhost; remove (and use https) anywhere else.
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
  MONGODB_URI: mongodb://mongo:27017/family_heritage?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in deploy/.env}
  CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET in deploy/.env}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Family Heritage <no-reply@localhost>}
  # Phone notifications: make a key pair with `npm run vapid -w backend` (leave empty to turn them off).
  WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
  WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
  # "Continue with Google" (optional): a Google OAuth client; its redirect URI is <APP_ORIGIN>/api/v1/auth/google/callback.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Encrypts authenticator-app secrets (32+ random characters). Changing it turns two-step sign-in off for everyone.
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
  ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
  # Street maps on the Places page (leave empty for a plain map). Also set MAP_TILE_ORIGINS below.
  MAP_TILE_URL: ${MAP_TILE_URL:-}
  MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}
  # Automatic transcripts of recordings: an OpenAI-compatible …/audio/transcriptions endpoint (leave empty to turn off).
  TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-}
  TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
  TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-whisper-1}
  STORAGE_DRIVER: s3
  S3_BUCKET: ${S3_BUCKET:-family-media}
  S3_REGION: us-east-1
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
  S3_FORCE_PATH_STYLE: 'true'
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-familyheritage}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
  LOG_LEVEL: info

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the single-node replica set on first start (transactions need a replica set).
      test: mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS). Any S3 service works in its place: set the S3_* variables.
  s3:
    image: chrislusf/seaweedfs:3.97
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-familyheritage}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
    ports: ['8333:8333']
    volumes: ['s3-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Creates the (private) bucket once.
  s3-setup:
    image: amazon/aws-cli:2.27.0
    depends_on: { s3: { condition: service_healthy } }
    entrypoint: ['/bin/sh', '-c', 'aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws --endpoint-url http://s3:8333 s3 mb "s3://$$S3_BUCKET"']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-familyheritage}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-family-media}
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ['8025:8025']
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    image: ${IMAGE_PREFIX:-family-heritage}-api:${IMAGE_TAG:-local}
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-setup: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: ${IMAGE_PREFIX:-family-heritage}-api:${IMAGE_TAG:-local}
    command: ['node', 'backend/dist/worker.js']
    environment: *api-env
    depends_on:
      api: { condition: service_started }
    healthcheck: { disable: true }
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: frontend/Dockerfile }
    image: ${IMAGE_PREFIX:-family-heritage}-web:${IMAGE_TAG:-local}
    environment:
      API_UPSTREAM: http://api:3000
      MEDIA_ORIGINS: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      MAP_TILE_ORIGINS: ${MAP_TILE_ORIGINS:-}
    ports: ['8080:8080']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  s3-data:
